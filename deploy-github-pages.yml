name: Déployer sur GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      - name: Compiler les bibliothèques partagées
        run: pnpm run typecheck:libs

      - name: Compiler le frontend pour GitHub Pages
        env:
          # ⚠️ IMPORTANT : Remplacez "cdej-espoir" par le nom exact de votre dépôt GitHub
          # Exemple : votre repo est github.com/jean/mon-projet → BASE_PATH=/mon-projet/
          # Si c'est votre site principal (username.github.io) → BASE_PATH=/
          BASE_PATH: /cdej-espoir/
          PORT: "4173"
          NODE_ENV: production
        run: pnpm --filter @workspace/cdej-espoir run build

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Téléverser les fichiers compilés
        uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/cdej-espoir/dist/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
